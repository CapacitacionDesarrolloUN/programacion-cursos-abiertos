<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#CB333B">
  <title>Cursos abiertos · Uninorte</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23CB333B'/><path d='M10 9v9a6 6 0 0 0 12 0V9' fill='none' stroke='white' stroke-width='3.4' stroke-linecap='round'/><circle cx='24.5' cy='24.5' r='3' fill='%23FFCD00'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="/styles.css">

<body class="sin-sesion">
  <header class="barra" id="barra" hidden>
    <div class="barra-interior">
      <div class="marca">
        <span class="logo" role="img" aria-label="Universidad del Norte"></span>
        <span class="marca-separador" aria-hidden="true"></span>
        <span class="marca-texto">
          <strong>Cursos abiertos</strong>
          <small>Capacitación y Desarrollo</small>
        </span>
      </div>
      <nav id="pestanas" class="pestanas" aria-label="Secciones"></nav>
      <div id="quien" class="quien"></div>
    </div>
  </header>

  <main id="app">
    <div class="cargando"><span class="punto"></span><span class="punto"></span><span class="punto"></span></div>
  </main>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
